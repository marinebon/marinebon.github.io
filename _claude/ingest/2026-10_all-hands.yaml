# curated ingest for the 2026-10 US MBON All-Hands before/after demo.
#
# built by Claude from unstructured sources (no rigid format required):
#   - "MBON All-Hands PI Updates" Google Slides (Year 5, one slide per node / WG)
#   - "MBON All Hands Meeting_Oct 2026_draft agenda" Google Doc
#   - reports Frank Muller-Karger emailed to ben@ecoquants.com:
#       NOAA CPO Sanctuaries Indicators RPPR, Sep 2026 (NA22OAR4310561)
#       NASA MBON Yr4 RPPR, 2026-05-30 (80NSSC22K1779)
#       NOAA CPO Sanctuaries Indicators progress report, Jan 2026
# raw per-source extractions (with page/slide citations) were reduced to this file:
#   papers  = peer-reviewed + published, with a DOI that Crossref resolves (title/authors/
#             journal/year/abstract come from Crossref, not from the source text)
#   events  = dated, public meetings not already on the site
#   tools   = named products with a live URL (HTTP 200 on 2026-10-15) not already on the site
# held back for PI review (not ingested) are listed under `held:`.
#
# apply with:  python3 scripts/ingest_extracted.py _claude/ingest/2026-10_all-hands.yaml

