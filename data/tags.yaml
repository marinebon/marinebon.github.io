# Tag label + ordering registry for the whole site.
#
# Tags are written `facet.Value` in content front matter (e.g. method.Remote-Sensing).
# Tags are for FILTER & SEARCH only. Content TYPE is structural (the section); it's also
# exposed to search as the `content` facet (no front-matter tags — emitted by baseof.html
# as `content:<section>`). Page-to-page links use the `related:` front-matter field, NOT tags.
#
# The unified filter+search control (layouts/partials/tag-filter.html +
# static/js/tag-filter.js) DERIVES its options from the tags actually in use — this file no
# longer decides *which* filters exist. It now supplies presentation only:
#
#   facet    machine prefix; also the color key (--facet-<facet> / .tag--<facet>) and the
#            dropdown group ORDER (facets appear in the order listed in this file)
#   label    human heading shown above the facet's group of pills
#   values   friendly display labels for known values: { value, name }
#   aliases  display-name overrides for open-set values (org.GEOBON → "GEO BON")
#   role     LEGACY, informational only — `subtype` (tool.*) vs `attribute` (everything else)
#   filters  LEGACY, no longer read (the old per-section filter bars are gone)
#
# Fallbacks make new tags safe: an unregistered value is humanized in the UI, and a facet
# with no --facet-<facet> token gets an auto-generated color (see tag-filter.js genColor).
#
# org vs portal: `org` = who BUILT a tool (developer, e.g. NOAA-IEA); `portal` = whose
# DATA a tool uses / where a dataset is served (OBIS/GBIF/EDI/ERDDAP). OBIS is a portal,
# not an org. Don't mint a `topic.*` that duplicates a method/place.
#
# Used by: layouts/partials/tag.html (label lookup), layouts/partials/tag-filter.html
#          (labels + facet order for the picker), layouts/tags/terms.html (/tags index).
# Adding a value here only improves its label; add it to the matching
# .github/ISSUE_TEMPLATE/add-*.yml dropdown so the issue form offers it.

# `content` = content section (Tools/Papers/Datasets/News/…). Search-only, so `filters: []`
# (list pages are already one type). Facet name is `content` (not `type`) to avoid colliding
# with the `tool` subtype facet's "Type" label and amber color. Emitted as the Pagefind
# filter `content:<section>` by baseof.html; the picker derives its pills from the index.
- facet: content
  label: Content
  role: attribute
  filters: []
  values:
    - { value: tools,          name: Tools }
    - { value: papers,         name: Papers }
    - { value: datasets,       name: Datasets }
    - { value: news,           name: News }
    - { value: events,         name: Events }
    - { value: methods,        name: Methods }
    - { value: network,        name: Network }
    - { value: working-groups, name: "Working Groups" }

- facet: portal
  label: Portal
  role: attribute
  filters: [datasets, tools]
  values:
    - { value: OBIS,   name: OBIS }
    - { value: GBIF,   name: GBIF }
    - { value: EDI,    name: EDI }
    - { value: ERDDAP, name: ERDDAP }

- facet: method
  label: Method
  role: attribute
  filters: [tools, papers, datasets]
  values:
    - { value: Remote-Sensing, name: "Remote Sensing" }
    - { value: Genomics,       name: Genomics }
    - { value: Acoustics,      name: Acoustics }
    - { value: Tracking,       name: Tracking }
    - { value: Indicators,     name: Indicators }
    - { value: Benthic,        name: Benthic }
    - { value: Traditional,    name: Traditional }
  aliases:
    Data-Mgmt: "Data Management"

- facet: tool
  label: Type
  role: subtype
  filters: [tools]
  values:
    - { value: Portal,      name: Portal }
    - { value: App,         name: App }
    - { value: Infographic, name: Infographic }
    - { value: Package,     name: Package }
    - { value: Protocol,    name: Protocol }
    - { value: Training,    name: Training }
    - { value: Workflow,    name: Workflow }

- facet: place
  label: Region
  role: attribute
  filters: [tools, datasets]
  values:
    - { value: Global,         name: Global }
    - { value: US,             name: "U.S." }
    - { value: Americas,       name: Americas }
    - { value: North-Atlantic, name: "N. Atlantic" }
    - { value: South-Florida,  name: "South FL" }
    - { value: Europe,         name: Europe }
    - { value: Arctic,         name: Arctic }
    - { value: Antarctic,      name: Antarctic }
    - { value: Monterey-Bay,   name: "Monterey Bay" }
    - { value: Bering-Sea,     name: "Bering Sea" }
    - { value: Coastal,        name: Coastal }
  aliases:
    Azores:  Azores
    Lisbon:  Lisbon
    Uruguay: Uruguay
    Asia-Pacific:              "Asia-Pacific"
    New-England:               "New England"
    Great-Lakes:               "Great Lakes"
    Gulf-of-Maine:             "Gulf of Maine"
    Mid-Atlantic:              "Mid-Atlantic"
    California-Current:        "California Current"
    Southern-California-Bight: "Southern California Bight"

- facet: org
  label: Organization
  role: attribute
  filters: [tools]
  values:
    - { value: NOAA-IEA,                  name: "NOAA IEA" }
    - { value: NationalMarineSanctuaries, name: "Nat'l Marine Sanctuaries" }
    - { value: FWRI,                      name: FWRI }
  aliases:
    GEOBON:      "GEO BON"
    FWBON:       FWBON
    MBON:        MBON
    NOAA:        NOAA
    IOOS:        IOOS
    GOOS:        GOOS
    UN:          UN
    UNEP:        UNEP
    UNESCO:      UNESCO
    Seabed2030:  "Seabed 2030"
    AIR-Centre:  "AIR Centre"

- facet: topic
  label: Topic
  role: attribute
  filters: []
  values: []
  aliases:
    EOV:                  EOV
    eDNA:                 eDNA
    UN-Ocean-Decade:      "UN Ocean Decade"
    Marine-Life-2030:     "Marine Life 2030"
    Marine-Protected-Areas: "Marine Protected Areas"
    Muller-Karger:        "Müller-Karger"
    All-Atlantic:         "All-Atlantic"

- facet: year
  label: Year
  role: attribute
  filters: [papers]
  values: []
